<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página não encontrada · Ser Único</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
:root {
  --lavender: #d9cde3;
  --lavender-soft: #ece4f1;
  --aubergine: #3d2a52;
  --cream: #faf5ed;
  --terracotta: #c4654a;
  --bg: #fdfcfe;
  --muted: #6b5f7d;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--aubergine);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}
.container { max-width: 560px; }
img.logo { width: 120px; height: auto; margin-bottom: 2rem; }
h1 {
  font-family: 'Fraunces', serif;
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 400;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
  line-height: 1.1;
}
h1 em { color: var(--terracotta); font-style: italic; }
p { color: var(--muted); font-size: 1.1rem; margin-bottom: 2rem; line-height: 1.6; }
a {
  display: inline-block;
  background: var(--aubergine);
  color: var(--cream);
  padding: 1rem 1.8rem;
  border-radius: 100px;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.25s;
}
a:hover { background: var(--terracotta); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="container">
  <img src="logo-dark.webp" alt="Ser Único" class="logo" />
  <h1>Esta página foi <em>levada pelo vento.</em></h1>
  <p>A página que procurava não existe ou foi movida. Mas estamos aqui, e o quiz continua à sua espera.</p>
  <a href="/">Voltar ao início →</a>
</div>
</body>
</html>
